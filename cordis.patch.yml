# mycel mode bundle layer: the working-modes plugin over dsh-base.
# Applies after the profile's base layers; the single inserted row registers
# the static `mycel:core-behavior` system-prompt section and the stateless
# `switch_mode` tool (methodology as its ordinary result, zero session events).

- insert:
    - id: mycel-mode
      name: '@xiyiyiru/dsh-mode'
